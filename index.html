<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SADAM VOX</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="gold-frame">

    <div class="background-layer">

        <!-- GOLD STREAMS -->
        <div class="stream s1"></div>
        <div class="stream s2"></div>
        <div class="stream s3"></div>
        <div class="stream s4"></div>
        <div class="stream s5"></div>
        <div class="stream s6"></div>
        <div class="stream s7"></div>
        <div class="stream s8"></div>
        <div class="stream s9"></div>
        <div class="stream s10"></div>
        <div class="stream s11"></div>
        <div class="stream s12"></div>

        <!-- MUSIC NOTES -->
        <div class="music-note note1">♪</div>
        <div class="music-note note2">♫</div>
        <div class="music-note note3">♬</div>
        <div class="music-note note4">♩</div>
        <div class="music-note note5">♪</div>
        <div class="music-note note6">♫</div>
        <div class="music-note note7">♬</div>

        <!-- PARTICLES -->
        <div class="particle p1"></div>
        <div class="particle p2"></div>
        <div class="particle p3"></div>
        <div class="particle p4"></div>
        <div class="particle p5"></div>
        <div class="particle p6"></div>
        <div class="particle p7"></div>
        <div class="particle p8"></div>
        <div class="particle p9"></div>
        <div class="particle p10"></div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
