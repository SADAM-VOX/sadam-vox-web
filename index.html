<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SADAM VOX AI STUDIO</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            <h2>SADAM VOX</h2>
            <span>AI MUSIC STUDIO</span>
        </div>

        <nav>

            <button class="menu-btn active">
                🎙️ استنساخ الصوت
            </button>

            <button class="menu-btn">
                🎧 تنظيف الصوت
            </button>

            <button class="menu-btn">
                🎼 إنشاء الهارموني
            </button>

            <button class="menu-btn">
                👥 مولد الكورال
            </button>

            <button class="menu-btn">
                🎵 تأليف موسيقي
            </button>

            <button class="menu-btn">
                🎤 المغني الذكي
            </button>

            <button class="menu-btn">
                🎚️ استوديو المكس
            </button>

            <button class="menu-btn">
                💿 الماسترنغ
            </button>

            <button class="menu-btn">
                ✂️ فصل المسارات
            </button>

            <button class="menu-btn">
                📢 تصميم المؤثرات
            </button>

        </nav>

    </aside>

    <main class="content">

        <header class="top-header">

            <div class="title">
                SADAM VOX
            </div>

            <div class="actions">
                ☁️ ⚙️ ☰
            </div>

        </header>

        <section class="hero">

            <div class="voice-panel">

                <h2>استنساخ الصوت</h2>

                <div class="wave">
                    ███ █████ ███ ██████ ███
                </div>

                <select>
                    <option>العربية</option>
                </select>

                <button>
                    استنساخ الصوت
                </button>

            </div>

            <div class="mic-panel">

                <div class="mic">
                    🎙️
                </div>

            </div>

        </section>

        <section class="music-engine">

            <h2>محرك الموسيقى</h2>

        </section>

        <section class="maqamat">

            <div class="card">
                <h3>المقامات الشرقية</h3>
            </div>

            <div class="card">
                <h3>المقامات اليمنية</h3>
            </div>

        </section>

    </main>

</div>

<script src="app.js"></script>

</body>
</html>
