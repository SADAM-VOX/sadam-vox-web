<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SADAM VOX</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="brand">
            <h2>SADAM VOX</h2>
            <span>AI MUSIC STUDIO</span>
        </div>

        <ul>
            <li>🎙️ استنساخ الصوت</li>
            <li>🎧 تنظيف الصوت</li>
            <li>🎼 إنشاء الهارموني</li>
            <li>👥 مولد الكورال</li>
            <li>🎵 تأليف موسيقى</li>
            <li>🎤 المغني الذكي</li>
            <li>🎚️ استوديو المكس</li>
            <li>💿 الماسترينج</li>
            <li>✂️ فصل المسارات</li>
            <li>🔊 تصميم المؤثرات</li>
        </ul>

    </aside>

    <main class="main">

        <section class="hero">

            <h1>SADAM VOX</h1>
            <p>منصة الذكاء الصوتي القادمة</p>

        </section>

        <section class="panel">

            <h2>🎙️ Voice Clone</h2>

            <input type="file">

            <select>
                <option>العربية</option>
                <option>English</option>
            </select>

            <button>استنساخ الصوت</button>

        </section>

        <section class="panel">

            <h2>🎼 Music Engine</h2>

            <div class="grid">

                <select>
                    <option>صنعاني</option>
                    <option>لحجي</option>
                    <option>حضرمي</option>
                </select>

                <select>
                    <option>بياتي</option>
                    <option>راست</option>
                    <option>حجاز</option>
                </select>

                <select>
                    <option>80 BPM</option>
                    <option>100 BPM</option>
                    <option>120 BPM</option>
                </select>

            </div>

            <button>إنشاء موسيقى</button>

        </section>

    </main>

</div>

<script src="app.js"></script>

</body>
</html>
