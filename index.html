<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADAM VOX AI MUSIC STUDIO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="main-container">
    <header class="header">
        <h1>SADAM VOX AI MUSIC STUDIO</h1>
    </header>

    <div class="content-wrapper">
        <aside class="sidebar">
            <button class="btn-royal-gold">استنساخ الصوت</button>
            <button class="btn-royal-gold">تنظيف الصوت</button>
            <button class="btn-royal-gold">AI Singer</button>
            <button class="btn-royal-gold">تأليف موسيقي</button>
            <button class="btn-royal-gold">المشاريع</button>
            <button class="btn-royal-gold">إدارة الملفات</button>
        </aside>

        <main class="dashboard">
            <div class="grid-layout">
                <div class="gold-glass-panel"><h3>VOICE CLONE</h3><button class="btn-royal-gold">START NOW</button></div>
                <div class="gold-glass-panel"><h3>VOICE CLEANER</h3><button class="btn-royal-gold">START NOW</button></div>
                <div class="gold-glass-panel"><h3>AI SINGER</h3><button class="btn-royal-gold">START NOW</button></div>
                <div class="gold-glass-panel"><h3>MUSIC COMPOSER</h3><button class="btn-royal-gold">START NOW</button></div>
            </div>

            <div class="recent-projects gold-glass-panel">
                <h3>RECENT PROJECTS</h3>
                <ul>
                    <li>Yemeni Song Project - 24/05/2024</li>
                    <li>Arabic Maqam Project - 23/05/2024</li>
                </ul>
            </div>

            <div class="system-status gold-glass-panel">
                <h3>System Status</h3>
                <div class="stats">CPU: 26% | GPU: 42% | RAM: 56%</div>
            </div>
        </main>
    </div>
</div>

</body>
</html>
